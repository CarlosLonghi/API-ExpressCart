spring:
  application:
    name: expresscart

  mvc:
    throw-exception-if-no-handler-found: true

  web:
    resources:
      add-mappings: false

  data:
    mongodb:
      host: localhost
      port: 27017
      database: express-cart
    redis:
      host: localhost
      port: 6379
      password: password

expresscart:
  cache:
    product-ttl: 60s
    product-list-ttl: 60s
  client:
    platzi: https://api.escuelajs.co/api/v1